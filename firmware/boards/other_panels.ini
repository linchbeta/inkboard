

# ════ 移植自 EPD-nRF5 的面板，未在真机上验证 ════════════════
# ── 4.2寸三色屏 UC8176（微雪 4.2inch B V1、GDEW042Z15），移植自 EPD-nRF5 ──
[env:epd_42_uc8176_bwr_c3_promini]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = partitions/custom_wroom32e.csv
build_flags =
    -DBOARD_PROFILE_ESP32_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=400
    -DEPD_HEIGHT=300
    -DEPD_PANEL_42_UC8176_BWR
    -DEPD_BPP=2
    -DALLOW_INSECURE_FALLBACK=0
[env:epd_42_uc8176_bwr_wroom32e]
extends = common
board = esp32dev
upload_speed = 115200
board_build.partitions = partitions/custom_wroom32e.csv
build_flags =
    -DBOARD_PROFILE_ESP32_WROOM32E
    -DEPD_WIDTH=400
    -DEPD_HEIGHT=300
    -DEPD_PANEL_42_UC8176_BWR
    -DEPD_BPP=2
    -DEPD_GXEPD2_SPI_HZ=4000000
    -DALLOW_INSECURE_FALLBACK=0
[env:epd_42_uc8176_bwr_c3_promini_led5]
extends = env:epd_42_uc8176_bwr_c3_promini
build_flags =
    ${env:epd_42_uc8176_bwr_c3_promini.build_flags}
    -DBOARD_VARIANT_C3_LED5
